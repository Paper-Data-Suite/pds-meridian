[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pds-meridian"
dynamic = ["version"]
description = "Policy-driven grading, evidence aggregation, and reporting for Paper Data Suite"
readme = { file = "README", content-type = "text/markdown" }
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Stephen Severino" }]
dependencies = [
    "pds-core>=0.6,<0.7",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "build",
    "mypy",
    "packaging",
    "pytest",
    "ruff",
    "twine",
]

[project.scripts]
meridian = "meridian.cli:main"

[project.urls]
Documentation = "https://github.com/Paper-Data-Suite/pds-meridian/tree/main/docs"
Repository = "https://github.com/Paper-Data-Suite/pds-meridian"

[tool.setuptools.dynamic]
version = { attr = "meridian._version.__version__" }

[tool.setuptools.packages.find]
include = ["meridian", "meridian.*"]
namespaces = false

[tool.setuptools.package-data]
meridian = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["meridian", "scripts"]

[[tool.mypy.overrides]]
module = ["pds_core", "pds_core.*"]
follow_untyped_imports = true
