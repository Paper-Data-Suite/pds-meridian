name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]

    runs-on: ${{ matrix.os }}

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Configure runner-local paths
        shell: pwsh
        run: |
          $coreDirectory = Join-Path $env:RUNNER_TEMP "core"
          $scoreformDirectory = Join-Path $env:RUNNER_TEMP "scoreform"
          $quillanDirectory = Join-Path $env:RUNNER_TEMP "quillan"
          $concordDirectory = Join-Path $env:RUNNER_TEMP "concord"
          New-Item -ItemType Directory -Force -Path $coreDirectory | Out-Null
          New-Item -ItemType Directory -Force -Path $scoreformDirectory | Out-Null
          New-Item -ItemType Directory -Force -Path $quillanDirectory | Out-Null
          New-Item -ItemType Directory -Force -Path $concordDirectory | Out-Null

          $coreWheel = Join-Path `
            $coreDirectory `
            "pds_core-0.6.3-py3-none-any.whl"

          "PDS_CORE_WHEEL=$coreWheel" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $scoreformWheel = Join-Path `
            $scoreformDirectory `
            "scoreform-0.11.0-py3-none-any.whl"
          "SCOREFORM_WHEEL=$scoreformWheel" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $quillanWheel = Join-Path `
            $quillanDirectory `
            "quillan-0.10.0-py3-none-any.whl"
          "QUILLAN_WHEEL=$quillanWheel" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $concordWheel = Join-Path `
            $concordDirectory `
            "pds_concord-0.3.0-py3-none-any.whl"
          "CONCORD_WHEEL=$concordWheel" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "RUFF_CACHE_DIR=$(Join-Path $env:RUNNER_TEMP 'ruff-cache')" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "MYPY_CACHE_DIR=$(Join-Path $env:RUNNER_TEMP 'mypy-cache')" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download official Core release wheel
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/Paper-Data-Suite/pds-core/releases/download/v0.6.3/pds_core-0.6.3-py3-none-any.whl" `
            -OutFile $env:PDS_CORE_WHEEL `
            -ErrorAction Stop

          if (-not (Test-Path -LiteralPath $env:PDS_CORE_WHEEL -PathType Leaf)) {
            throw "Core wheel download did not create $env:PDS_CORE_WHEEL."
          }

      - name: Authenticate and install Core
        shell: pwsh
        run: |
          python scripts/verify_core_wheel.py "$env:PDS_CORE_WHEEL"
          python -m pip install "$env:PDS_CORE_WHEEL"

      - name: Download official ScoreForm release wheel
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/Paper-Data-Suite/pds-scoreform/releases/download/v0.11.0/scoreform-0.11.0-py3-none-any.whl" `
            -OutFile $env:SCOREFORM_WHEEL `
            -ErrorAction Stop
          python scripts/verify_scoreform_wheel.py "$env:SCOREFORM_WHEEL"
          python -m pip install "$env:SCOREFORM_WHEEL"

      - name: Download official Quillan release wheel
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/Paper-Data-Suite/pds-quillan/releases/download/v0.10.0/quillan-0.10.0-py3-none-any.whl" `
            -OutFile $env:QUILLAN_WHEEL `
            -ErrorAction Stop
          python scripts/verify_quillan_wheel.py "$env:QUILLAN_WHEEL"
          python -m pip install "$env:QUILLAN_WHEEL"

      - name: Download official Concord release wheel
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/Paper-Data-Suite/pds-concord/releases/download/v0.3.0/pds_concord-0.3.0-py3-none-any.whl" `
            -OutFile $env:CONCORD_WHEEL `
            -ErrorAction Stop
          python scripts/verify_concord_wheel.py "$env:CONCORD_WHEEL"
          python -m pip install "$env:CONCORD_WHEEL"

      - name: Install Meridian development dependencies
        run: python -m pip install -e ".[dev,scoreform,quillan,concord]"

      - name: Remove editable-install residue
        shell: pwsh
        run: |
          @(
            "build",
            "dist",
            "pds_meridian.egg-info"
          ) | ForEach-Object {
            if (Test-Path -LiteralPath $_) {
              Remove-Item -Recurse -Force -LiteralPath $_
            }
          }

      - name: Run complete repository validation
        shell: pwsh
        run: >-
          python scripts/validate_repository.py
          --core-wheel "$env:PDS_CORE_WHEEL"
          --scoreform-wheel "$env:SCOREFORM_WHEEL"
          --quillan-wheel "$env:QUILLAN_WHEEL"
          --concord-wheel "$env:CONCORD_WHEEL"
